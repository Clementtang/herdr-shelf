<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'SF Mono', Menlo, Monaco, 'PingFang TC', monospace" font-size="14">
  <title>herdr-shelf 在 herdr 內的示意圖：左邊是 Claude Code session，右邊的側欄列出它送出的音檔，點一下用 Quick Look 開啟</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-small" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="40" y="30" width="1200" height="720" rx="14"/>
    </clipPath>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2f3b"/>
      <stop offset="1" stop-color="#262833"/>
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="1200" height="720" rx="14" fill="#1e1f29"/>
  </g>
  <g clip-path="url(#window-clip)">
    <rect x="40" y="30" width="1200" height="38" fill="url(#titlebar)"/>
    <line x1="40" y1="68" x2="1240" y2="68" stroke="#14151c"/>
    <circle cx="64" cy="49" r="6.5" fill="#ff5f57"/>
    <circle cx="86" cy="49" r="6.5" fill="#febc2e"/>
    <circle cx="108" cy="49" r="6.5" fill="#28c840"/>
    <text x="640" y="54" text-anchor="middle" fill="#9a9cab" font-size="13">herdr</text>

    <!-- herdr tab bar -->
    <rect x="40" y="69" width="1200" height="30" fill="#191a22"/>
    <rect x="52" y="74" width="120" height="22" rx="4" fill="#7c93f0"/>
    <text x="112" y="90" text-anchor="middle" fill="#1e1f29" font-weight="bold">1 meetings</text>
    <rect x="178" y="74" width="60" height="22" rx="4" fill="#262833"/>
    <text x="208" y="90" text-anchor="middle" fill="#6f7285">2</text>
    <text x="256" y="90" fill="#6f7285">+</text>

    <!-- Claude Code pane -->
    <rect x="54" y="110" width="920" height="624" rx="6" fill="none" stroke="#3a3d52"/>
    <rect x="68" y="102" width="60" height="16" fill="#1e1f29"/>
    <text x="74" y="115" fill="#6f7285" font-size="13">claude</text>

    <text x="80" y="150" fill="#6f7285">&gt;</text>
    <text x="100" y="150" fill="#c7c9d6">週會錄音切好了嗎？每位講者給我一段，我來認人。</text>

    <circle cx="84" cy="190" r="4" fill="#e6e7ee"/>
    <text x="100" y="195" fill="#e6e7ee">六位講者各切了一段，依講者編號排列。</text>
    <text x="100" y="227" fill="#8b8ea3">● SendUserFile&#160;&#160;6 files</text>
    <text x="120" y="253" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_00_12s.m4a</text>
    <text x="120" y="277" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_01_148s.m4a</text>
    <text x="120" y="301" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_02_433s.m4a</text>
    <text x="120" y="325" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_03_916s.m4a</text>
    <text x="120" y="349" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_04_852s.m4a</text>
    <text x="120" y="373" fill="#7c93f0">› [file] ~/…/samples/2026-09-23/SPEAKER_05_95s.m4a</text>
    <text x="100" y="413" fill="#e6e7ee">每段約 20 秒。聽完告訴我每個編號是誰，我把名字填回逐字稿。</text>

    <text x="80" y="461" fill="#6f7285">&gt;</text>
    <text x="100" y="461" fill="#c7c9d6">01 是我，03 是主持人，其他還要再聽一次。</text>
    <circle cx="84" cy="496" r="4" fill="#e6e7ee"/>
    <text x="100" y="501" fill="#e6e7ee">好，先填入這兩位。剩下四段在右邊的側欄，隨時可以重聽。</text>

    <line x1="68" y1="662" x2="960" y2="662" stroke="#3a3d52"/>
    <text x="80" y="688" fill="#c7c9d6">❯</text>
    <rect x="98" y="675" width="9" height="17" fill="#c7c9d6"/>
    <text x="80" y="718" fill="#6f7285" font-size="12">weekly-sync-0923</text>

    <!-- Shelf pane -->
    <rect x="986" y="110" width="240" height="624" rx="6" fill="none" stroke="#7c93f0"/>
    <rect x="1000" y="102" width="52" height="16" fill="#1e1f29"/>
    <text x="1005" y="115" fill="#7c93f0" font-size="13">Files</text>

    <text x="998" y="142" fill="#d7af5f" font-weight="bold">FILES&#160;&#160;weekly-sync-0923</text>
    <text x="998" y="164" fill="#5d6075">6 file(s)</text>

    <text x="998" y="194" fill="#e6e7ee">&#160;♪ SPEAKER_05_95s.m4a</text>
    <text x="998" y="214" fill="#5d6075">&#160;&#160;&#160;2026-09-23</text>
    <text x="998" y="240" fill="#e6e7ee">&#160;♪ SPEAKER_04_852s.m4a</text>
    <text x="998" y="260" fill="#5d6075">&#160;&#160;&#160;2026-09-23</text>

    <rect x="992" y="270" width="228" height="24" fill="#d7af5f"/>
    <text x="998" y="287" fill="#1e1f29" font-weight="bold">&#160;♪ SPEAKER_03_916s.m4a</text>
    <text x="998" y="310" fill="#d7af5f">&#160;&#160;&#160;2026-09-23</text>

    <text x="998" y="336" fill="#e6e7ee">&#160;♪ SPEAKER_02_433s.m4a</text>
    <text x="998" y="356" fill="#5d6075">&#160;&#160;&#160;2026-09-23</text>
    <text x="998" y="382" fill="#e6e7ee">&#160;♪ SPEAKER_01_148s.m4a</text>
    <text x="998" y="402" fill="#5d6075">&#160;&#160;&#160;2026-09-23</text>
    <text x="998" y="428" fill="#e6e7ee">&#160;♪ SPEAKER_00_12s.m4a</text>
    <text x="998" y="448" fill="#5d6075">&#160;&#160;&#160;2026-09-23</text>

    <text x="998" y="690" fill="#8a8a8a">六位講者各一段</text>
    <rect x="992" y="702" width="228" height="22" fill="#d7af5f"/>
    <text x="998" y="718" fill="#303030" font-size="12">&#160;q close&#160;&#160;enter open&#160;&#160;j/k</text>
  </g>

  <!-- Pointer clicking the selected row -->
  <path d="M1196 282 l0 22 l5.5 -5 l4 9 l3.5 -1.6 l-4 -8.8 l7.4 -0.4 z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Quick Look window opened by the click -->
  <g filter="url(#shadow-small)">
    <rect x="600" y="300" width="360" height="190" rx="12" fill="#2b2c33" stroke="#44465a"/>
  </g>
  <circle cx="620" cy="319" r="5.5" fill="#ff5f57"/>
  <circle cx="638" cy="319" r="5.5" fill="#febc2e"/>
  <circle cx="656" cy="319" r="5.5" fill="#28c840"/>
  <text x="780" y="323" text-anchor="middle" fill="#c7c9d6" font-size="12">SPEAKER_03_916s.m4a</text>
  <line x1="600" y1="336" x2="960" y2="336" stroke="#1d1e24"/>
  <g fill="#7c93f0">
    <rect x="628" y="396" width="4" height="12" rx="2"/>
    <rect x="638" y="386" width="4" height="32" rx="2"/>
    <rect x="648" y="378" width="4" height="48" rx="2"/>
