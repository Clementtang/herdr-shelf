# herdr-shelf 的 herdr plugin manifest。
# 本機開發：herdr plugin link ~/herdr-shelf
#
# 需要的系統工具：jq、python3（herdr 的 manifest 沒有相依欄位，請自行安裝）。
# Linux 另需 xdg-open（xdg-utils），沒有 SHELF_OPEN_CMD 時用它開檔。
# 開檔一律交給 SHELF_OPEN_CMD（預設 ~/.local/bin/semantic-open），
# 要換程式就改那一支，不改這個 plugin。

id = "clementtang.herdr-shelf"
name = "Herdr Shelf"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "常駐側欄，列出目前 session 送出的所有檔案，Enter 用自己的路由開啟。"
platforms = ["macos", "linux"]

# split 而非 overlay：這是常駐面板，overlay 會蓋住 agent 的輸出。
# pane 的 cwd 是 plugin 根目錄，不是使用者的工作目錄：使用者的目錄要從
# herdr pane list 回報的 origin pane cwd 取得（見 shelf.sh 的 load）。
# 腳本路徑一律寫成 $HERDR_PLUGIN_ROOT，不依賴 cwd。
[[panes]]
id = "shelf"
title = "Files"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/shelf.sh\""]

[[actions]]
id = "shelf"
title = "Shelf: 開關檔案側欄"
contexts = ["workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/toggle.sh\""]

# 安裝後第一次啟動 herdr 時自動綁 prefix+f，讓 plugin install 成為唯一步驟。
# 已經綁過（任何按鍵）或 prefix+f 被別的指令佔用時不動 config.toml。
[[actions]]
id = "install-keybind"
title = "Shelf: 在 config.toml 綁定 prefix+f"
contexts = ["global", "workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/install-keybind.sh\""]

[[startup]]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/install-keybind.sh\""]
