  </g>
  <g fill="#555869">
    <rect x="768" y="388" width="4" height="28" rx="2"/>
    <rect x="778" y="378" width="4" height="48" rx="2"/>
    <rect x="788" y="392" width="4" height="20" rx="2"/>
