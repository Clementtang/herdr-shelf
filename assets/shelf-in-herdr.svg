  <circle cx="630" cy="462" r="11" fill="#7c93f0"/>
  <path d="M626 456 l0 12 l10 -6 z" fill="#1e1f29"/>
  <rect x="652" y="460" width="240" height="4" rx="2" fill="#44465a"/>
  <rect x="652" y="460" width="104" height="4" rx="2" fill="#7c93f0"/>
  <text x="940" y="467" text-anchor="end" fill="#8b8ea3" font-size="12">0:09</text>

    <text x="640" y="782" text-anchor="middle" fill="#8b8ea3" font-size="13">點一下側欄的檔案，交給 semantic-open（音檔走 Quick Look）</text>
